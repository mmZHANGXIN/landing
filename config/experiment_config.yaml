# ============================================================
# Orin Landing v2 — 室内/室外公共配置模板 (ROS1 Noetic 版)
# 不要直接用于正式飞行；请选择 experiment_indoor_fastlio.yaml 或
# experiment_outdoor_gps.yaml。场景相关的定位模式、安全点和边界只在 profile 中维护。
# Mid360 LiDAR + FAST-LIO2 + HALSS Bayesian UNet + NN-fill depth + ONNX PPO2
# Jetson Orin NX / ROS Noetic / Ubuntu 20.04
# ============================================================

# ---- 运行时 ----
runtime:
  use_gpu: true                    # 强制 GPU (ARM64 CPU 有 Conv2d NaN bug)
  enable_detailed_profiling: true  # 逐帧细分耗时/质量/异常字段；false时保持旧frame_timing表头
  cold_warmup_timeout_s: 15        # CUDA/HALSS/ONNX 冷启动阶段独立超时
  fresh_validation_timeout_s: 10   # 冷启动完成后等待一帧新鲜有效数据的独立超时
  max_inference_result_age_ms: 500 # 点云header年龄+计算耗时小于此值即可执行，不要求绝对最新帧
  max_cloud_odom_sync_ms: 100      # FAST-LIO 点云/位姿 header 最大允许时间差
  drop_stale_frames: true          # 只丢弃超过 max_inference_result_age_ms 的结果
  drop_slow_frames: true           # 超龄结果不执行，改用 PX4 ENU 固定 XY 闭环保持
  device: "cuda"                   # "cuda" | "cpu" (cpu 仅离线调试)

# ---- 实验录制 (最小 rosbag + 复现记录) ----
experiment_recording:
  enabled: true                    # 正式实验默认录制; CLI --no-record-bag 仅用于台架调试
  required: true                   # 启用录制时，rosbag 启动失败则禁止进入解锁流程
  bag_topics:                      # 同时记录两套定位，供每次实验估计 FAST-LIO↔PX4 对齐
    - "/livox/lidar"
    - "/livox/imu"
    - "/cloud_registered_body"
    - "/mavros/vision_pose/pose"
    - "/mavros/local_position/odom"
    - "/mavros/global_position/global"
    - "/mavros/imu/data"
    - "/mavros/state"
    - "/mavros/extended_state"
    - "/mavros/setpoint_raw/local"
    - "/mavros/setpoint_raw/target_local"
  # 配置快照、运行元数据、动作日志和速度日志为正式实验固定输出，不设关闭开关。

# ---- 观测空间 ----
observation:
  img_width: 128
  img_height: 128
  depth_norm_mode: "raw_meters_graph_scaled" # ONNX 图内已有 /255；外部输入原始米制深度
  semantic_norm_mode: "raw_gray_graph_scaled" # ONNX 图内已有 /255；外部输入原始灰度(terrain=30, others=250)

# ---- 无人机参数 ----
uav:
  vel_lateral: 1.0                 # 与 DRL 训练环境一致: 水平速度 (m/s)
  vel_vertical: 2.0              # 与当前 PPO2 训练动作一致；DIRECT_LAND仍独立限速0.25m/s
  # 全局唯一偏航率配置入口；软件不限制数值范围。
  yaw_rate_rad_s: 5.0              # 偏航转速 (rad/s, 0=不旋转)
  action_frame: "body"             # DRL 横移坐标系: "body" 机体系 / "ned"
  execution_yaw_source: "px4_ekf"  # body动作转世界速度使用PX4 yaw，避免假设FAST-LIO world=地理NED
  action_lateral_sign: -1          # 原DeepRL动作符号: vel_y=-sin(angle); +1=右手镜像模式

  max_t: 360.0                      # 最大飞行时间 (秒)
  sim_dt: 0.25                     # 决策步长 (秒)
  # 急停门控
  max_roll_pitch_deg: 30.0         # 最大姿态角 (度)

# ---- 飞控通信 (MAVROS/PX4 Offboard) ----
flight_controller:
  backend: "mavros"                 # 当前真机入口仅支持 MAVROS
  mavros_ns: "/mavros"             # MAVROS 命名空间
  setpoint_rate_hz: 20             # setpoint_raw 发布频率
  offboard_warmup_s: 2.0           # OFFBOARD 模式切换前 setpoint 预热时长

# ---- 任务状态机 ----
mission_state:
  height_source: "fastlio_z"       # 室外profile覆盖为px4_enu_z；室内仍使用FAST-LIO
  height_axis: "pos_z"
  ground_z_ref_m: 0.0              # 地面高度基准; auto_ground_z_ref=true 时自动记录
  auto_ground_z_ref: true          # true=IDLE时用当前pose.z自动记录地面基准
  direct_land_enabled: true
  direct_land_trigger_height_m: 0.5
  landed_height_m: 0.15
  direct_land_vz_mps: 0.25
  direct_land_lock_xy_yaw: true
  direct_land_continue_yaw_rate: true
  perception_timeout_s: 0.5
  timeout_direct_land_max_height_m: 0.8
  pose_timeout_s: 0.2
  ground_crosscheck_enabled: true  # 点云地面距离只做交叉校验, 不作为默认高度源
  ground_crosscheck_action: "warn" # "warn" | "block"
  ground_crosscheck_max_error_m: 0.5

# ---- 定位源约定 ----
localization:
  # mode 与 px4_position_source 由 indoor/outdoor profile 显式设置。
  # 话题
  fastlio_odom_topic: "/ali_odom"
  world_cloud_topic: "/ali_cloud"
  body_cloud_topic: "/cloud_registered_body"
  fastlio_pose_required: true       # outdoor frontend-only profile overrides false
  max_gps_age_s: 2.0
  max_gps_horizontal_accuracy_m: 5.0
  external_pose_topic: "/mavros/vision_pose/pose" # 室内发布、室外禁止发布，由 FAST-LIO launch 参数控制
  local_odom_topic: "/mavros/local_position/odom"

# ---- FAST-LIO 健康门控 ----
fastlio_health:
  require_static_initialization: true
  static_initialization_s: 5.0
  static_max_drift_m: 0.2
  initial_position_norm_max_m: 50.0
  max_pose_age_ms: 200              # 位姿最大允许时延
  max_cloud_age_ms: 200             # 点云最大允许时延
  max_cloud_odom_sync_ms: 100       # 点云-位姿最大时间同步偏移
  min_cloud_points: 50              # 点云最少点数
  pose_jump_threshold_m: 1.0        # 位姿跳变阈值 (米)
  degraded_control_action: "direct_land"       # FAST-LIO pose 退化时使用 MAVROS ENU 锁 XY 降落
  degraded_cloud_action: "direct_land"         # cloud 退化时的安全动作 ("direct_land" | "abort")

# ---- 感知: HALSS 贝叶斯安全语义 ----
perception:
  halss_backend: "bayesian_unet"
  require_gpu: true                 # 真机禁止 HALSS Bayesian 推理静默回退 CPU
  world_z_up: true                  # ENU world (z-up); HALSS needs z-down, so auto-negate z
  pose_origin_frame: "base_link"   # "base_link": /ali_odom is already body pose; "lidar_imu": pose is at IMU origin
  # /cloud_registered_body is expressed at the Mid360 IMU origin.
  body_R_from_lidar_imu: [-0.438371, 0.0, 0.898794, 0.0, 1.0, 0.0, -0.898794, 0.0, -0.438371]
  body_T_from_lidar_imu: [0.13, 0.0, 0.08]

  # --- Bayesian UNet 参数 ---
  halss_weight_path: "../arch/3.UDPDirect30Hz_cyd_final/HALO-master (2)/HALSS/network_utils/unet_epoch6.pth"
  halss_grid_res: 64               # surface normal 网格分辨率 (必须被 16 整除)
  mc_samples: 5                    # MC Dropout 采样数
  uncertainty_threshold: 0.8       # 方差阈值 (超过则判为危险)

  # --- 语义与 ROI ---
  safe_class_id: 1                 # 语义图安全类别 ID
  danger_class_id: 9               # 语义图危险类别 ID
  halss_roi_half_x_m: 5.0          # 动态 ROI 关闭时的 forward 半宽 (m)
  halss_roi_half_y_m: 5.0          # 动态 ROI 关闭时的 lateral 半宽 (m)

  # --- 动态 ROI（training_camera 模式按原训练相机内参计算前后/左右范围）---
  halss_roi_min_half_m: 0.05       # 仅数值下限，不对低高度训练相机 FOV 人为放大
  halss_roi_max_half_m: 30.0       # 覆盖30m高度训练相机的完整左右视场
  halss_roi_height_source: "pose_z" # 高度源: "pose_z"=Fast-LIO z减去起飞z | "pointcloud_median"=点云z中位数
  halss_roi_dynamic_enabled: true  # true=按高度动态缩放ROI | false=用halss_roi_half_x_m/y_m静态值

  halss_min_down_m: 0.05           # 只处理机体下方点: 最小向下距离
  halss_max_down_m: 30.0           # 只处理机体下方点: 最大向下距离
  halss_ground_min_down_m: 0.0     # 地面候选过滤: 若>0, 跳过z_down小于此值的近场杂点 (建议0.3)
  halss_yaw_only: true             # HALSS 用世界重力+yaw 对齐, 不把安装俯仰当坡度
  halss_lidar_position_body_m: [0.13, 0.0, 0.08]  # Mid360 相对机体中心 [前,右,下] 米: 图中 13cm / 0cm / 8cm
  halss_lidar_yaw_offset_deg: 0.0  # Mid360 水平安装偏航误差; 图中未标侧向/偏航, 暂按 0
  # Outdoor frontend publishes the deskewed scan at the Mid360 IMU origin.
  # The 116° mount compensation is applied exactly once here, then PX4
  # timestamp-matched roll/pitch levels the aircraft-frame cloud.

# ---- 当前真机深度路径: 原训练相机几何 + OpenCV NN-fill ----
depth_projection:
  mode: "training_camera"
  backend: "numpy_opencv_nn_fill"
  max_range: 30.0                  # 深度图最大距离 dmax (米)
  grid_cells: 128                  # 输出分辨率 (128×128)
  training_camera:
    source_width: 752
    source_height: 480
    source_fx: 455.0
    source_fy: 455.0
    source_cx: 376.5
    source_cy: 240.5
    output_width: 128
    output_height: 128
    near_m: 0.05
    far_m: 30.0

# SparseNet 已停用；旧模块仅保留给离线对比，不参与 pipeline.py。

# ---- RL 决策 ----
decision:
  backend: "onnx"
  onnx_model_path: "weights/ppo2_policy.onnx"
  onnx_meta_path: "weights/ppo2_policy_meta.json"
  require_gpu: true                 # 真机禁止策略推理静默回退 CPU

# ---- 全局安全先验 (离线 GIS 预处理结果) ----
global_prior:
  # enabled、mode 与安全点由 indoor/outdoor profile 显式设置。
  goto_tolerance_xy_m: 0.2         # XY 到达容差 (米)
  goto_tolerance_z_m: 0.2         # Z 到达容差 (米)
  goto_max_time_s: 80.0            # GOTO 阶段最大超时 (秒), 超时后由配置决定进入 DIRECT_LAND 或 ABORT
  goto_timeout_action: "direct_land"  # 超时动作: "direct_land" | "abort"
  takeoff_speed_z_ms: 2.0           # Phase 1 垂直起飞速度，与 DRL 动作速度分离
  goto_max_horizontal_speed_mps: 2.0 # 室外GOTO速度XY硬上限；室内profile不启用该速度模式
  goto_max_vertical_speed_mps: 2.0   # 人工接管后的30m归位与GOTO垂直速度硬上限
  goto_horizontal_kp_s: 1.0          # 临近目标按v=kp*距离减速，最大不超过上述上限

  # GIS 离线分割模型
  model_arch: "segformer"          # "segformer" | "fastscnn" | "unet"
  model_path: "preprocessing/segmentation/checkpoints/segformer_best.pth"
  # 九宫格参数
  grid_size_cells: 3               # 3×3 九宫格
  cell_size_m: 95.0                # 每格边长 (米)

# ---- 可视化 ----
visualization:
  enable: true
  show_binary_semantic: true       # 显示 "binary semantic" 窗口
  show_depth: true                 # 显示深度图窗口
  display_width: 300
  display_height: 300
  depth_vmax_m: 30.0               # 深度相机式渲染固定色标上限
  binary_semantic_window_title: "binary semantic"
  save_frames: false
  save_raw_arrays: false           # 旧离线调试开关，当前主管线不使用
  save_dir: "experiments/frames"
  action_collapse_monitor: true    # 连续同一DRL动作时告警并保存诊断帧
  action_collapse_window: 20        # 连续N帧同一动作触发
  action_collapse_min_confidence: 0.0
  action_collapse_save_snapshot: true

# ZeroMQ 感知/补全/DRL 三服务链路已停用。旧服务文件仅保留做离线参考，
# 当前 pipeline.py 为单进程 HALSS + NN-fill + ONNX + MAVROS 闭环。
